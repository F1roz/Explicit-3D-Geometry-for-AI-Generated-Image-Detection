[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism3d"
version = "0.1.0"
description = "Does explicit monocular 3D geometry add to AI generated image detectors? Code for the PRISM-3D study."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "scikit-learn>=1.4", "opencv-python-headless>=4.9",
                "pillow>=10.0", "matplotlib>=3.8", "pyyaml>=6.0"]

[project.optional-dependencies]
gpu = ["torch>=2.2", "torchvision>=0.17", "transformers>=4.45", "accelerate>=0.30", "diffusers>=0.30",
       "huggingface_hub>=0.24", "datasets>=2.20", "timm>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
